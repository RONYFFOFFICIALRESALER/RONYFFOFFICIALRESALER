<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>RONY FF — Video URL Generator</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#0b1020;color:#fff;margin:0;padding:18px}
.box{max-width:520px;margin:auto;background:#151c32;border-radius:18px;padding:20px;box-shadow:0 10px 30px #0006}
h1{font-size:22px;line-height:1.25;margin:0 0 10px}
.muted{color:#aeb7cf;font-size:14px;line-height:1.45}
input,button{width:100%;margin-top:10px;padding:14px;border-radius:12px;font-size:15px}
input{border:1px solid #39435f;background:#0e1425;color:#fff}
button{border:0;background:#2563eb;color:#fff;font-weight:700}
button:disabled{opacity:.5}
.fileArea{margin-top:14px;padding:15px;border:1px dashed #53617f;border-radius:14px;background:#0e1425}
#fileInput{display:none}
.selectBtn{display:block;text-align:center;background:#334155;padding:15px;border-radius:12px;font-weight:700;cursor:pointer}
.fileName{margin-top:10px;color:#67e8a5;font-size:14px;word-break:break-word}
video{width:100%;margin-top:15px;border-radius:12px;display:none}
.ok{color:#67e8a5}.err{color:#ff8b8b}
.url{margin-top:15px;background:#0b1222;padding:12px;border-radius:12px;word-break:break-all;color:#8be9fd}
.small{font-size:12px;color:#8d99b5;margin-top:8px}
</style>
</head>
<body>
<div class="box">
<h1>🎬 RONY FF — Video URL Generator</h1>
<div class="muted">Login करो → SELECT VIDEO दबाओ → वीडियो चुनो → Upload करो → URL Admin Panel में डालो.</div>

<input id="email" type="email" placeholder="Admin email" autocomplete="username">
<input id="password" type="password" placeholder="Admin password" autocomplete="current-password">
<button id="loginBtn">LOGIN</button>
<div id="loginStatus" class="muted"></div>

<div class="fileArea">
<input id="fileInput" type="file" accept=".mp4,.webm,video/mp4,video/webm">
<button type="button" id="selectBtn" disabled>SELECT VIDEO</button>
<div id="fileName" class="fileName">कोई वीडियो select नहीं हुआ</div>
<div class="small">MP4 / WebM • अधिकतम 200 MB</div>
</div>

<button id="uploadBtn" disabled>UPLOAD VIDEO & GET URL</button>
<div id="status" class="muted"></div>
<video id="preview" controls playsinline preload="metadata"></video>

<div id="result" style="display:none">
<div class="muted">आपका Video URL:</div>
<div id="url" class="url"></div>
<button id="copyBtn">COPY URL</button>
</div>
</div>

<script>
const SUPABASE_URL='https://dgknhptbbozshyfiyobo.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='sb_publishable_NEHCtr3Y0o8FctOz5Jm59A_P4GhFAQd';
const BUCKET='product-videos';
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);

const $=id=>document.getElementById(id);
const setStatus=(msg,ok=false)=>{$('status').textContent=msg;$('status').className=ok?'ok':'muted'};

let selectedFile=null;
let objectUrl=null;

$('loginBtn').onclick=async()=>{
  const email=$('email').value.trim();
  const password=$('password').value;
  if(!email||!password){$('loginStatus').textContent='Email और password डालो.';return}
  $('loginBtn').disabled=true;
  $('loginStatus').textContent='Login हो रहा है...';
  const {error}=await db.auth.signInWithPassword({email,password});
  if(error){
    $('loginStatus').textContent='Login error: '+error.message;
    $('loginBtn').disabled=false;
    return;
  }
  $('loginStatus').textContent='✅ Login सफल';
  $('email').disabled=true;
  $('password').disabled=true;
  $('selectBtn').disabled=false;
  $('uploadBtn').disabled=false;
};

function handleFile(f){
  if(!f){selectedFile=null;$('fileName').textContent='कोई वीडियो select नहीं हुआ';return}
  if(!f.type.startsWith('video/') && !/\.(mp4|webm)$/i.test(f.name)){
    selectedFile=null;$('fileInput').value='';
    setStatus('सिर्फ MP4 या WebM वीडियो चुनो.',false);return;
  }
  if(f.size>200*1024*1024){
    selectedFile=null;$('fileInput').value='';
    setStatus('Video 200 MB से छोटा रखो.',false);return;
  }
  selectedFile=f;
  $('fileName').textContent='✅ '+f.name;
  if(objectUrl) URL.revokeObjectURL(objectUrl);
  objectUrl=URL.createObjectURL(f);
  $('preview').src=objectUrl;
  $('preview').style.display='block';
  setStatus('✅ Video select हो गया. अब UPLOAD VIDEO & GET URL दबाओ.',true);
}

$('selectBtn').onclick=async()=>{
  // Prefer the modern picker when available; it avoids the Android
  // file-input selection issue on supported Chrome versions.
  if(window.showOpenFilePicker){
    try{
      const handles=await window.showOpenFilePicker({
        multiple:false,
        types:[{description:'Video files',accept:{'video/mp4':['.mp4'],'video/webm':['.webm']}}]
      });
      if(handles && handles[0]){
        const f=await handles[0].getFile();
        handleFile(f);
      }
      return;
    }catch(e){
      if(e && e.name==='AbortError') return;
    }
  }
  $('fileInput').click();
};

$('fileInput').addEventListener('change',e=>{
  const f=e.target.files && e.target.files[0];
  handleFile(f);
});

$('uploadBtn').onclick=async()=>{
  if(!selectedFile)return setStatus('पहले SELECT VIDEO दबाकर वीडियो चुनो.');
  const {data:{user}}=await db.auth.getUser();
  if(!user)return setStatus('Login session नहीं मिला. फिर से login करो.');
  $('uploadBtn').disabled=true;
  setStatus('Upload हो रहा है, थोड़ा इंतज़ार करो...');
  const ext=(selectedFile.name.split('.').pop()||'mp4').toLowerCase();
  const safe=(selectedFile.name.replace(/\.[^/.]+$/,'').replace(/[^a-zA-Z0-9_-]/g,'_')||'video').slice(0,60);
  const path=user.id+'/'+Date.now()+'-'+safe+'.'+ext;
  const {error}=await db.storage.from(BUCKET).upload(path,selectedFile,{
    contentType:selectedFile.type||('video/'+ext),
    upsert:false,
    cacheControl:'3600'
  });
  if(error){
    setStatus('Upload failed: '+error.message,false);
    $('uploadBtn').disabled=false;
    return;
  }
  const {data}=db.storage.from(BUCKET).getPublicUrl(path);
  $('url').textContent=data.publicUrl;
  $('result').style.display='block';
  setStatus('✅ Upload पूरा. यह URL Admin Panel में डालो.',true);
  $('uploadBtn').disabled=false;
};

$('copyBtn').onclick=async()=>{
  const text=$('url').textContent;
  try{
    await navigator.clipboard.writeText(text);
  }catch(e){
    const ta=document.createElement('textarea');
    ta.value=text;document.body.appendChild(ta);ta.select();
    document.execCommand('copy');ta.remove();
  }
  $('copyBtn').textContent='COPIED ✅';
  setTimeout(()=>$('copyBtn').textContent='COPY URL',1500);
};
</script>
</body>
</html>
